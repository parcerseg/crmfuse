function visibleStages(){
  return STAGES.filter(s=>LOCKED_STAGES.includes(s.id) || !HIDDEN_STAGES.includes(s.id));
}
/* =========================================================
   CLIENTES — cadastro/consulta padrão, separado do Funil de Vendas
   ========================================================= */
let CLIENTES_SEARCH_DONE = false;
function pesquisarClientes(){
  CLIENTES_FILTERS.q = (document.getElementById('cli_search_q')||{}).value || '';
  CLIENTES_FILTERS.situacao = (document.getElementById('cli_search_situacao')||{}).value || '';
  CLIENTES_FILTERS.tipo = (document.getElementById('cli_search_tipo')||{}).value || '';
  CLIENTES_SEARCH_DONE = true;
  renderClientesView();
}
function limparClientesFiltros(){
  CLIENTES_FILTERS = { situacao:'', tipo:'', q:'' };
  CLIENTES_SEARCH_DONE = false;
  renderClientesView();
}
function clientesSearchPanelHTML(){
  return `
    <div class="panel">
      <div class="panel-title">Consulta de Clientes</div>
      <div class="field-grid" style="margin-top:10px;">
        <div class="field full">
          <label>Nome, CPF/CNPJ, e-mail ou telefone</label>
          <input id="cli_search_q" value="${CLIENTES_FILTERS.q||''}" placeholder="Digite para pesquisar..." onkeydown="if(event.key==='Enter'){ event.preventDefault(); pesquisarClientes(); }"/>
        </div>
        <div class="field">
          <label>Tipo de Pessoa</label>
          <select id="cli_search_tipo">
            <option value="">Todos</option>
            <option value="fisica" ${CLIENTES_FILTERS.tipo==='fisica'?'selected':''}>Física (CPF)</option>
            <option value="juridica" ${CLIENTES_FILTERS.tipo==='juridica'?'selected':''}>Jurídica (CNPJ)</option>
          </select>
        </div>
        <div class="field">
          <label>Situação</label>
          <select id="cli_search_situacao">
            <option value="">Todas</option>
            <option value="ativo" ${CLIENTES_FILTERS.situacao==='ativo'?'selected':''}>Ativo</option>
            <option value="inativo" ${CLIENTES_FILTERS.situacao==='inativo'?'selected':''}>Inativo</option>
          </select>
        </div>
      </div>
      <p style="font-size:11px;color:var(--text-faint);margin:10px 0 0;">Deixe os campos em branco e clique em Pesquisar para listar todos os clientes cadastrados.</p>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap;">
        <button class="btn" onclick="limparClientesFiltros()">Limpar</button>
        <button class="btn btn-primary" onclick="pesquisarClientes()">${ICONS.search} Pesquisar</button>
      </div>
    </div>
  `;
}
function renderClientesView(){
  const root = document.getElementById('clientesRoot');
  if(!root) return;
  if(!CLIENTES_SEARCH_DONE){
    root.innerHTML = clientesSearchPanelHTML() + emptyState('Faça uma pesquisa para ver os clientes', 'Use o formulário acima e clique em "Pesquisar" — por padrão, a lista de clientes não é exibida.');
    return;
  }
  const q = (CLIENTES_FILTERS.q||'').toLowerCase();
  const isAdmin = isAdminRole();
  const list = clientsInScope().filter(c=>{
    if(CLIENTES_FILTERS.situacao && (c.clientStatus||'ativo')!==CLIENTES_FILTERS.situacao) return false;
    if(CLIENTES_FILTERS.tipo && (c.personType||'fisica')!==CLIENTES_FILTERS.tipo) return false;
    if(!q) return true;
    return (c.name||'').toLowerCase().includes(q) ||
      (c.cpfCnpj||'').toLowerCase().includes(q) ||
      (c.email||'').toLowerCase().includes(q) ||
      (c.phone||'').toLowerCase().includes(q) ||
      (c.whatsapp||'').toLowerCase().includes(q);
  }).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  root.innerHTML = `
    ${clientesSearchPanelHTML()}
    <div class="panel" style="margin-top:14px;">
      <div class="panel-title">Resultado <span class="tag">${list.length}</span></div>
      <div style="overflow-x:auto;margin-top:10px;">
        <table class="admin-table">
          <thead><tr>
            <th>Nome</th><th>Tipo</th><th>CPF/CNPJ</th><th>Telefone</th><th>E-mail</th><th>Cidade</th><th>Situação</th>${isAdmin?'<th>Divisão</th>':''}
          </tr></thead>
          <tbody>
            ${list.length ? list.map(c=>`
              <tr style="cursor:pointer;" onclick="openClientModal('${c.id}')">
                <td data-label="Nome"><strong>${c.name||'—'}</strong></td>
                <td data-label="Tipo">${(c.personType||'fisica')==='juridica'?'PJ':'PF'}</td>
                <td data-label="CPF/CNPJ">${c.cpfCnpj||'—'}</td>
                <td data-label="Telefone">${c.phone||c.whatsapp||'—'}</td>
                <td data-label="E-mail">${c.email||'—'}</td>
                <td data-label="Cidade">${c.city||'—'}</td>
                <td data-label="Situação"><span class="sub-pill ${(c.clientStatus||'ativo')==='ativo'?'ok':'suspended'}">${(c.clientStatus||'ativo')==='ativo'?'Ativo':'Inativo'}</span></td>
                ${isAdmin?`<td data-label="Divisão">${groupById(c.groupId)?groupById(c.groupId).name:'—'}</td>`:''}
              </tr>
            `).join('') : `<tr><td colspan="${isAdmin?8:7}" style="text-align:center;color:var(--text-faint);padding:24px;">Nenhum cliente encontrado com esses filtros.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderKanban(){
  renderFilterBar('kanbanFilterBar');
  const clients = filteredClients();
  const wrap = document.getElementById('kanbanWrap');
  let html = visibleStages().map(stage=>{
    const items = clients.filter(c=>c.stage===stage.id);
    return `
      <div class="kanban-col" data-stage="${stage.id}" ondragover="onColDragOver(event,this)" ondragleave="this.classList.remove('drag-over')" ondrop="onColDrop(event,'${stage.id}')">
        <div class="kanban-col-head">
          <span class="col-dot" style="background:${stage.color}"></span>
          <span class="col-title">${stage.name}</span>
          <span class="col-count">${items.length}</span>
        </div>
        <div class="col-sum">${items.length} cliente${items.length===1?'':'s'} nesta etapa</div>
        <div class="kanban-cards">
          ${items.length ? items.map(c=>cardHTML(c)).join('') : `<div style="text-align:center;color:var(--text-faint);font-size:11.5px;padding:14px 6px;">Sem clientes</div>`}
        </div>
      </div>
    `;
  }).join('');

  if(isAdminRole() && FILTERS.showDeleted){
    const deleted = deletedClientsInScope();
    html += `
      <div class="kanban-col kanban-col-deleted">
        <div class="kanban-col-head">
          <span class="col-dot" style="background:#94A3B8"></span>
          <span class="col-title">Excluídos</span>
          <span class="col-count">${deleted.length}</span>
        </div>
        <div class="col-sum">clientes removidos do funil</div>
        <div class="kanban-cards">
          ${deleted.length ? deleted.map(c=>cardHTML(c)).join('') : `<div style="text-align:center;color:var(--text-faint);font-size:11.5px;padding:14px 6px;">Nenhum cliente excluído</div>`}
        </div>
      </div>
    `;
  }
  wrap.innerHTML = html;
}

function cardHTML(c){
  if(c.deleted){
    return `
      <div class="card card-deleted" data-id="${c.id}">
        <div class="card-top">
          <span class="card-name">${c.name}</span>
          <span class="card-origin">Excluído</span>
        </div>
        <div class="card-sub">${c.product} · ${c.insurer}</div>
        <div class="delete-reason">${c.deleteReason ? c.deleteReason : '<em>Sem motivo informado</em>'}</div>
        <div class="delete-meta">${c.deletedBy||''}${c.deletedAt?' · '+fmtDate(c.deletedAt):''}</div>
        <div class="card-meta" style="margin-top:8px;">
          <button class="btn btn-sm" onclick="event.stopPropagation(); restoreClient('${c.id}')">${ICONS.check} Restaurar</button>
        </div>
      </div>
    `;
  }
  let flag='';
  if(c.renewalDate){
    const d=daysUntil(c.renewalDate);
    if(d>=0 && d<=7) flag=`<div class="card-flag flag-red">Renova em ${d}d</div>`;
    else if(d>7 && d<=15) flag=`<div class="card-flag flag-yellow">Renova em ${d}d</div>`;
    else if(d>15 && d<=30) flag=`<div class="card-flag flag-green">Renova em ${d}d</div>`;
  }
  return `
    <div class="card" draggable="true" data-id="${c.id}" ondragstart="onCardDragStart(event,'${c.id}')" ondragend="this.classList.remove('dragging')" onclick="openClientModal('${c.id}')">
      <button class="card-del-btn" title="Excluir cliente" onclick="event.stopPropagation(); requestDeleteClient('${c.id}')">${ICONS.trash}</button>
      <div class="card-top">
        <span class="card-name">${c.name}</span>
        <span class="card-origin">${c.leadOrigin}</span>
      </div>
      <div class="card-sub">${c.product} · ${c.insurer}</div>
      <div class="card-meta">
        <span class="card-premium">${c.premium?fmtMoney(c.premium):'—'}</span>
        <span class="card-owner" title="${c.owner}">${initials(c.owner)}</span>
      </div>
      ${flag}
    </div>
  `;
}

function requestDeleteClient(id){
  if(isAdminRole()){
    deleteClientWithReason(id, '');
    return;
  }
  if(!hasPerm('negocios_excluir')){ toast('Você não tem permissão para excluir clientes. Fale com seu gestor.'); return; }
  openDeleteReasonModal(id);
}
function openDeleteReasonModal(id){
  const c = DB.clients.find(x=>x.id===id);
  const html = `
    <div class="modal modal-small">
      <div class="modal-head">
        <div class="mh-info"><div class="mh-name">Excluir cliente</div><div class="mh-sub">${c.name}</div></div>
        <button class="modal-close" onclick="closeModal()">${ICONS.close}</button>
      </div>
      <div class="modal-body" style="padding:20px 22px;">
        <div class="field full">
          <label>Motivo da exclusão</label>
          <textarea id="del_reason" placeholder="Explique por que está excluindo este cliente..."></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-danger" onclick="confirmDeleteWithReason('${id}')">${ICONS.trash} Excluir</button>
      </div>
    </div>
  `;
  document.getElementById('modalOverlay').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
function confirmDeleteWithReason(id){
  const reason = document.getElementById('del_reason').value.trim();
  if(!reason){ toast('Informe o motivo da exclusão'); return; }
  deleteClientWithReason(id, reason);
  closeModal();
}
function deleteClientWithReason(id, reason){
  const c = DB.clients.find(x=>x.id===id);
  c.deleted = true;
  c.deleteReason = reason;
  c.deletedAt = todayISO();
  c.deletedBy = CURRENT_USER.name;
  persist();
  renderNav();
  renderCurrentView();
  toast('Cliente excluído');
}
function restoreClient(id){
  const c = DB.clients.find(x=>x.id===id);
  c.deleted=false; c.deleteReason=''; c.deletedAt=''; c.deletedBy='';
  persist();
  renderCurrentView();
  toast('Cliente restaurado');
}

/* =========================================================
   INDICAÇÕES — kanban parecido com o Funil de Vendas
   ========================================================= */
function indicacoesInScope(){
  applyIndicacaoAutoStage();
  let list = DB.indicacoes||[];
  if(isAdminRole()){
    list = ADMIN_GROUP_FILTER ? list.filter(i=>i.groupId===ADMIN_GROUP_FILTER) : list.filter(i=>inVisibleScope(i.groupId));
  } else {
    list = list.filter(i=>i.groupId===CURRENT_USER.groupId);
  }
  if(FILTERS.q){
    const q = FILTERS.q.toLowerCase();
    list = list.filter(i=>i.clientName.toLowerCase().includes(q) || (i.phone||'').includes(q));
  }
  return list;
}
function daysInStage(ind){
  const d = daysUntil(ind.stageChangedAt||ind.createdAt);
  return Math.abs(d);
}
function renderIndicacoes(){
  renderFilterBar('indicacoesFilterBar');
  const all = indicacoesInScope();
  const showAll = INDICACOES_SHOW_ALL;
  const total = all.length;
  const indicacoesCount = all.filter(i=>i.tipo==='indicacao').length;
  const renovacoesCount = all.filter(i=>i.tipo==='renovacao').length;
  const agendadosCount = all.filter(i=>i.stage==='agendado').length;
  const statsEl = document.getElementById('indicacoesStats');
  if(statsEl){
    statsEl.innerHTML = `
      <div class="kpi-grid" style="margin-bottom:10px;">
        ${kpi('Total', total, 'registros', 'var(--navy)', 'var(--blue-light)', ICONS.kanban)}
        ${kpi('Indicações', indicacoesCount, 'indicações novas', 'var(--blue)', 'var(--blue-light)', ICONS.kanban)}
        ${kpi('Renovações', renovacoesCount, 'em acompanhamento', 'var(--gold)', 'var(--sky-tint)', ICONS.renew)}
        ${kpi('Agendados', agendadosCount, 'vigência a mais de 30 dias', 'var(--text-muted)', 'var(--surface-alt)', ICONS.file)}
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);cursor:pointer;">
        <input type="checkbox" ${showAll?'checked':''} onchange="INDICACOES_SHOW_ALL=this.checked; renderIndicacoes();"/> Mostrar todos?
      </label>
    `;
  }
  const wrap = document.getElementById('indicacoesWrap');
  if(!wrap) return;
  const list = showAll ? all : all.filter(i=>i.responsavelId===CURRENT_USER.id || i.createdBy===CURRENT_USER.id || isAdminRole());
  wrap.innerHTML = IND_STAGES.map(stage=>{
    const items = list.filter(i=>i.stage===stage.id);
    return `
      <div class="kanban-col" data-stage="${stage.id}" ondragover="onIndColDragOver(event,this)" ondragleave="this.classList.remove('drag-over')" ondrop="onIndColDrop(event,'${stage.id}')">
        <div class="kanban-col-head">
          <span class="col-dot" style="background:${stage.color}"></span>
          <span class="col-title">${stage.name}</span>
          <span class="col-count">${items.length}</span>
        </div>
        <div class="kanban-cards">
          ${items.length ? items.map(i=>indicacaoCardHTML(i)).join('') : `<div style="text-align:center;color:var(--text-faint);font-size:11.5px;padding:14px 6px;">Sem itens</div>`}
        </div>
      </div>
    `;
  }).join('');
}
function truncateStr(s, n){
  if(!s) return '—';
  return s.length>n ? s.slice(0,n).trim() : s;
}
function indicacaoCardHTML(ind){
  const stage = indStageOf(ind.stage);
  const badgeColor = ind.tipo==='renovacao' ? '#0EA5E9' : '#8B5CF6';
  const g = groupById(ind.groupId);
  const movedTs = ind.stageChangedTs || ind.createdTs;
  const movedLabel = movedTs ? fmtDateTime(new Date(movedTs).toISOString()) : fmtDate(ind.stageChangedAt||ind.createdAt);
  return `
    <div class="card ind-card" draggable="true" data-id="${ind.id}" ondragstart="onIndCardDragStart(event,'${ind.id}')" ondragend="this.classList.remove('dragging')" onclick="openIndicacaoDetailModal('${ind.id}')" style="border-left:3px solid ${stage.color};">
      <div class="card-top">
        <span class="card-name" title="${(ind.clientName||'').replace(/"/g,'')}">${ind.clientName}</span>
        <span class="card-origin" style="background:${badgeColor}22;color:${badgeColor};">${indTipoLabel(ind.tipo)}</span>
      </div>
      <div class="card-sub" title="${(g?g.name:'').replace(/"/g,'')} · ${(ind.responsavelName||'').replace(/"/g,'')}">${g?g.name:'—'} · ${ind.responsavelName||'—'}</div>

function handleImportIndFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const isAdmin = isAdminRole();
  const groupSel = document.getElementById('imp_ind_group');
  const targetGroupId = isAdmin ? (groupSel ? groupSel.value : ADMIN_GROUP_FILTER) : CURRENT_USER.groupId;
  if(!targetGroupId){ toast('Selecione a divisão antes de importar'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:false});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      let count = 0;
      rows.forEach(row=>{
        const clientName = (row['Cliente']||'').toString().trim();
        if(!clientName) return;
        const vigencia = (row['Vigência']||'').toString();
        const tipoRaw = (row['Tipo']||'').toString().toLowerCase();
        const tipo = tipoRaw.includes('renov') ? 'renovacao' : 'indicacao';
        const stage = (vigencia && daysUntil(vigencia)>30) ? 'agendado' : 'a_tratar';
        DB.indicacoes.unshift({
          id: uid('ind'), groupId: targetGroupId, tipo, clientName,
          phone: (row['Telefone']||'').toString(), vigencia,
          insurer: (row['Seguradora']||INSURERS[0]).toString(), product: (row['Produto']||PRODUCTS[0]).toString(),
          melhorHorario:'', negociacao:'', observacao: (row['Observação']||'').toString(),
          stage, stageChangedAt: todayISO(), createdAt: todayISO(),
          stageChangedTs: Date.now(), createdTs: Date.now(),
          createdBy: CURRENT_USER.id, createdByName: CURRENT_USER.name,
          responsavelId:null, responsavelName:'—',
          history:[{date:todayISO(), text:'Importado(a) via planilha.'}],
        });
        count++;
      });
      persistIndicacoes();
      renderNav();
      renderCurrentView();
      closeModal();
      toast(`${count} registro(s) importado(s) com sucesso`);
    }catch(err){
      console.error(err);
      toast('Não foi possível ler a planilha. Verifique o formato.');
    }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function currentMonthRange(){
  const d = new Date();
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0);
  const iso = x=>x.toISOString().slice(0,10);
  return {from: iso(first), to: iso(last)};
}
let DASH_FILTER = currentMonthRange();
function updateDashFilter(){
  DASH_FILTER = { from: document.getElementById('dash_from').value, to: document.getElementById('dash_to').value };
  renderDashboard();
}
function resetDashFilterToCurrentMonth(){
  DASH_FILTER = currentMonthRange();
  renderDashboard();
}

function renderDashboard(){
  const clients = filteredClients();
  const inPeriod = c => c.closedDate && (!DASH_FILTER.from || c.closedDate>=DASH_FILTER.from) && (!DASH_FILTER.to || c.closedDate<=DASH_FILTER.to);
  const closed = clients.filter(c=>c.stage==='fechado' && inPeriod(c));
  const lost = clients.filter(c=>c.stage==='perdido' && inPeriod(c));
  const open = clients.filter(c=>!['fechado','perdido'].includes(c.stage));
  const totalClosedValue = closed.reduce((a,c)=>a+(c.premium||0),0);
  const totalLostValue = lost.reduce((a,c)=>a+(c.premium||0),0);
  const conversion = (closed.length+lost.length)>0 ? Math.round(closed.length/(closed.length+lost.length)*100) : 0;
  const isCurrentMonth = JSON.stringify(DASH_FILTER)===JSON.stringify(currentMonthRange());

  // rankings
  const byInsurer = {}; closed.forEach(c=>byInsurer[c.insurer]=(byInsurer[c.insurer]||0)+c.premium);
  const topInsurers = Object.entries(byInsurer).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const byProduct = {}; closed.forEach(c=>byProduct[c.product]=(byProduct[c.product]||0)+1);
  const topProducts = Object.entries(byProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const avgTicket = closed.length ? Math.round(totalClosedValue/closed.length) : 0;

  // propostas e apólices no período
  const propsInPeriod = proposalsInScope().filter(p=>{
    const d = p.createdAt;
    return (!DASH_FILTER.from || d>=DASH_FILTER.from) && (!DASH_FILTER.to || d<=DASH_FILTER.to);
  });
  const propsPendentes = propsInPeriod.filter(p=>p.status==='pendente').length;
  const propsAprovadas = propsInPeriod.filter(p=>p.status==='aprovada'||p.status==='emitida').length;
  const apolicesEmitidas = propsInPeriod.filter(p=>p.status==='emitida');
  const premioLiquidoTotal = apolicesEmitidas.reduce((a,p)=>a+(p.premiumLiquido||0),0);
  const comissaoMedia = apolicesEmitidas.length ? (apolicesEmitidas.reduce((a,p)=>a+(p.commissionPct||0),0)/apolicesEmitidas.length) : 0;

  const showNegocios = isSuperAdmin() || hasPerm('dash_ver_negocios');
  const showPropostas = isSuperAdmin() || hasPerm('dash_ver_propostas');
  const showRanking = isSuperAdmin() || hasPerm('dash_ver_ranking');
  const showCorretoras = isAdminRole() && (isSuperAdmin() || hasPerm('dash_ver_corretoras'));

  document.getElementById('dashRoot').innerHTML = `
    <div class="dash-period-bar">
      <span class="dpb-label">${isCurrentMonth ? 'Mostrando o mês atual' : 'Período personalizado'}</span>
      <span class="dpb-sep">·</span>
      <label>De</label><input type="date" id="dash_from" value="${DASH_FILTER.from}" onchange="updateDashFilter()"/>
      <label>até</label><input type="date" id="dash_to" value="${DASH_FILTER.to}" onchange="updateDashFilter()"/>
      ${!isCurrentMonth ? `<button class="btn btn-sm btn-ghost" onclick="resetDashFilterToCurrentMonth()">Voltar ao mês atual</button>` : ''}
    </div>

    ${showNegocios ? `
      <div class="kpi-grid">
        ${kpi('Valor Fechado', fmtMoney(totalClosedValue), closed.length+' negócios', 'var(--success)', 'var(--success-light)', ICONS.money)}
        ${kpi('Valor Perdido', fmtMoney(totalLostValue), lost.length+' negócios', 'var(--danger)', 'var(--danger-light)', ICONS.money)}
        ${kpi('Oportunidades Abertas', open.length, 'em andamento no funil', 'var(--blue)', 'var(--blue-light)', ICONS.kanban)}
        ${kpi('Taxa de Conversão', conversion+'%', 'fechados / (fechados+perdidos)', 'var(--navy)', 'var(--blue-light)', ICONS.down)}
      </div>
      <div class="kpi-grid">
        ${kpi('Fechados', closed.length, 'negócios ganhos no período', 'var(--success)', 'var(--success-light)', ICONS.check)}
        ${kpi('Perdidos', lost.length, 'negócios perdidos no período', 'var(--danger)', 'var(--danger-light)', ICONS.close)}
        ${kpi('Ticket Médio', fmtMoney(avgTicket), 'valor médio por negócio fechado', 'var(--gold)', 'var(--sky-tint)', ICONS.money)}
        ${kpi('Total de Clientes', clients.length, 'na base do FUSE', 'var(--navy)', 'var(--blue-light)', ICONS.kanban)}
      </div>
    ` : ''}

    ${showPropostas ? `
      <div class="panel">
        <div class="panel-title">Propostas e Apólices no período</div>
        <div class="kpi-grid" style="margin-top:10px;">
          ${kpi('Propostas Pendentes', propsPendentes, 'aguardando aceite', 'var(--warning)', 'var(--warning-light)', ICONS.file)}
          ${kpi('Propostas Aprovadas', propsAprovadas, 'aceitas ou emitidas', 'var(--success)', 'var(--success-light)', ICONS.check)}
          ${kpi('Apólices Emitidas', apolicesEmitidas.length, 'no período', 'var(--blue)', 'var(--blue-light)', ICONS.policy)}
          ${kpi('Prêmio Líquido Total', fmtMoney(premioLiquidoTotal), 'soma das apólices emitidas', 'var(--navy)', 'var(--blue-light)', ICONS.money)}
          ${kpi('Comissão Média', comissaoMedia.toFixed(1)+'%', 'das apólices emitidas', 'var(--gold)', 'var(--sky-tint)', ICONS.money)}
        </div>
      </div>
    ` : ''}

    ${showRanking ? `
      <div class="panel">
        <div class="panel-title">Ranking do período</div>
        <div class="grid-2" style="margin-top:4px;">
          <div>
            <div style="font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;">Seguradora que mais vendeu</div>
            <div class="rank-list">${topInsurers.length? topInsurers.map((r,i)=>rankRow(i,r[0],fmtMoney(r[1]))).join('') : emptyRank()}</div>
          </div>
          <div>
            <div style="font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;">Produto mais vendido</div>
            <div class="rank-list">${topProducts.length? topProducts.map((r,i)=>rankRow(i,r[0],r[1]+' vendas')).join(''): emptyRank()}</div>
          </div>
        </div>
      </div>
    ` : ''}

    ${showCorretoras ? corretoraRankingHTML() : ''}
    ${!showNegocios && !showPropostas && !showRanking && !showCorretoras ? emptyState('Nenhum bloco liberado', 'Peça ao administrador para liberar os blocos do dashboard nas Permissões.') : ''}
  `;

  animateCounters();
}

function kpi(label,value,sub,color,bg,icon){
  return `<div class="kpi-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">

function animateCounters(){
  const els = document.querySelectorAll('.big-counter[data-count]');
  els.forEach(el=>{
    const target = parseFloat(el.getAttribute('data-count'))||0;
    const isMoney = el.getAttribute('data-money')==='1';
    const dur = 700;
    const t0 = performance.now();
    function step(t){
      const p = Math.min(1,(t-t0)/dur);
      const eased = 1-Math.pow(1-p,3);
      const val = target*eased;
      el.textContent = isMoney ? fmtMoney(val) : Math.round(val).toLocaleString('pt-BR');
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function rankRow(i,name,val){
  return `<div class="rank-row"><span class="rank-idx">${i+1}</span><span class="rank-name">${name}</span><span class="rank-val">${val}</span></div>`;
}

function lastMonths(n){
  const arr=[];
  const now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    arr.push({label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''), y:d.getFullYear(), m:d.getMonth()});
  }
  return arr;
}

function renderTasks(){

}

function deleteTask(id){
  if(!isAdminRole() && !hasPerm('tarefas_excluir')){ toast('Você não tem permissão para excluir tarefas.'); return; }
  DB.tasks = DB.tasks.filter(x=>x.id!==id);
  persist();
  renderTasks();
  renderNav();
  toast('Tarefa excluída');
}

function toggleTaskDone(id){
  const t=DB.tasks.find(x=>x.id===id);
  t.status = t.status==='done' ? 'todo' : 'done';
  persist(); renderTasks(); renderNav();
}
function setTaskStatus(id,status){
  const t=DB.tasks.find(x=>x.id===id); t.status=status; persist(); renderTasks();
}
function rescheduleTask(id){
  const t=DB.tasks.find(x=>x.id===id);
  t.dueDate = todayISO(3);
  persist(); renderTasks(); toast('Tarefa reagendada para '+fmtDate(t.dueDate));
}

  const clientItems = filteredClients().filter(c=>c.renewalDate && daysUntil(c.renewalDate)>=0 && daysUntil(c.renewalDate)<=30)
    .map(c=>({type:'client', id:c.id, name:c.name, insurer:c.insurer, product:c.product, phone:c.phone, premium:c.premium, dueDate:c.renewalDate, days:daysUntil(c.renewalDate)}));
  const apoliceItems = proposalsInScope().filter(p=>p.status==='emitida' && p.vigenciaFim && daysUntil(p.vigenciaFim)>=0 && daysUntil(p.vigenciaFim)<=30)
    .map(p=>({type:'apolice', id:p.id, name:p.clientName, insurer:p.insurer, product:p.product, phone:'', premium:p.premiumLiquido||0, dueDate:p.vigenciaFim, days:daysUntil(p.vigenciaFim)}));
  const items = [...clientItems, ...apoliceItems];
  const groups = [
    {label:'Até 7 dias', color:'#F04438', filter:it=>it.days<=7},
    {label:'Até 15 dias', color:'#F79009', filter:it=>it.days>7 && it.days<=15},
    {label:'Até 30 dias', color:'#12B76A', filter:it=>it.days>15 && it.days<=30},
  ];
  const root = document.getElementById('renewRoot');
  const anyItems = items.length>0;
  if(!anyItems){ root.innerHTML = emptyState('Nenhuma renovação próxima', 'Não há apólices vencendo nos próximos 30 dias com os filtros atuais.'); return; }

  root.innerHTML = `<div class="renewal-groups">` + groups.map(g=>{
    const groupItems = items.filter(g.filter).sort((a,b)=>a.days-b.days);
    if(!groupItems.length) return '';
    return `
      <div>
        <div class="renewal-group-title"><span class="renewal-dot" style="background:${g.color}"></span>${g.label} <span style="color:var(--text-faint);font-weight:600;font-size:12px;">(${groupItems.length})</span></div>
        <div class="renewal-grid">
          ${groupItems.map(it=>`
            <div class="renewal-card">
              <div class="rc-top">
                <div class="rc-name">${it.name}</div>
                <div class="rc-days" style="background:${g.color}22;color:${g.color}">${it.days}d</div>
              </div>
              <div class="rc-sub">${it.insurer} · ${it.product}</div>
              ${it.phone ? `<div class="rc-sub">${it.phone}</div>` : ''}
              <div class="rc-premium">${fmtMoney(it.premium)}</div>
              <div class="rc-actions">
                ${it.type==='client' ? `
                  <button class="btn btn-primary btn-sm" onclick="renewNow('${it.id}')">Renovar Agora</button>
                  <button class="btn btn-wpp btn-sm" onclick="sendWhatsApp('${it.id}','renov')">${ICONS.wpp} WhatsApp</button>
                ` : `
                  <button class="btn btn-primary btn-sm" onclick="openApoliceDetailModal('${it.id}')">Ver Apólice</button>
                `}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('') + `</div>`;
}

function renewNow(id){
  const c = DB.clients.find(x=>x.id===id);

function sendWhatsApp(clientId, quickId){
  const c = DB.clients.find(x=>x.id===clientId);
  let text = `Olá ${c.name.split(' ')[0]}, tudo bem?`;
  if(quickId){
    const q = QUICK_MSGS.find(m=>m.id===quickId);
    if(q) text = q.text.replace('{nome}', c.name.split(' ')[0]);

  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');

async function saveTeamMember(isNew, userId){
  const name = document.getElementById('tm_name').value.trim();
  const email = document.getElementById('tm_email').value.trim().toLowerCase();
  const pass = document.getElementById('tm_pass').value;
  if(!name || !email){ toast('Preencha nome e e-mail'); return; }
  if(isNew && !pass){ toast('Defina uma senha para o novo usuário'); return; }
  const dupe = DB.users.find(x=>x.email.toLowerCase()===email && x.id!==userId);
  if(dupe){ toast('Já existe um usuário com esse e-mail'); return; }
  if(isNew){
    DB.users.unshift({ id:uid('usr'), name, email, password:pass, role:'corretor', groupId:CURRENT_USER.groupId, active:true, createdAt:todayISO(), permissions:{} });
    toast('Membro da equipe criado com sucesso. Não esqueça de definir as permissões dele.');
  }else{
    const u = DB.users.find(x=>x.id===userId);
    if(u.groupId!==CURRENT_USER.groupId || u.role!=='corretor'){ toast('Você só pode editar corretores da sua equipe'); return; }
    u.name=name; u.email=email;
    if(pass) u.password = pass;
    toast('Membro da equipe atualizado');
  }
  await persistUsers();
  closeModal();
  renderEquipe();
}

/* =========================================================
   PROPOSTA — envio de anexos pelo corretor, aprovação/emissão pelo admin
   ========================================================= */
const PROPOSAL_STATUS_LABEL = {
  pendente:'Pendente', aprovada:'Aceita', devolvida:'Devolvida', recusada:'Recusada', emitida:'Emitida', pendencia:'Pendência'
};
const PROPOSAL_STATUS_COLOR = {
  pendente:'warn', aprovada:'ok', devolvida:'warn', recusada:'expired', emitida:'ok', pendencia:'expired'
};
async function createPendencyTasks(p){
  // Fecha tarefas antigas dessa proposta (caso ela já tenha tido pendência antes)
  DB.tasks.forEach(t=>{ if(t.relatedProposalId===p.id && t.status!=='done') t.status='done'; });
  const title = `Resolver pendência — Proposta nº ${p.number} (${p.clientName})`;
  const targets = [];
  if(p.createdBy) targets.push(p.createdBy);
  DB.users.filter(u=>u.role==='gestor' && u.groupId===p.groupId && u.active).forEach(gu=>{ if(!targets.includes(gu.id)) targets.push(gu.id); });
  DB.users.filter(u=>u.role==='admin' && u.handlesPendencyTasks && u.active).forEach(au=>{ if(!targets.includes(au.id)) targets.push(au.id); });
  targets.forEach(targetUserId=>{
    DB.tasks.unshift({
      id: uid('tsk'), groupId: p.groupId, ownerId: targetUserId, scope:'personal',
      title, clientId: p.relatedClientId||null, relatedProposalId: p.id,
      type:'Documentação', priority:'Alta', dueDate: todayISO(), status:'todo', comments:[]
    });
  });
  await persist();
}
async function resolvePendencyTasks(proposalId){
  let changed = false;
  DB.tasks.forEach(t=>{ if(t.relatedProposalId===proposalId && t.status!=='done'){ t.status='done'; changed=true; } });
  if(changed) await persist();
}
function proposalsInScope(){
  if(isAdminRole()){
    return DB.proposals.filter(p=>inVisibleScope(p.groupId));
  }
  return DB.proposals.filter(p=>p.groupId===CURRENT_USER.groupId);
}
// Um cliente só é considerado aniversariante (widget do Dashboard) se tiver ao menos uma apólice
// emitida com status "vigente" (ATIVO) no menu Apólice — apólices canceladas/suspensas não contam.
function clientHasActivePolicy(client){
  return DB.proposals.some(p=>{
    if(p.status!=='emitida') return false;
    const matchesClient = client.id && p.relatedClientId
      ? p.relatedClientId===client.id
      : (p.clientName||'').trim().toLowerCase()===(client.name||'').trim().toLowerCase();
    if(!matchesClient) return false;
    return (p.apoliceStatus||'vigente')==='vigente';
  });
}
function nextProposalNumber(){
  const max = DB.proposals.reduce((m,p)=>Math.max(m,p.number||0), 1000);
  return max+1;
}
async function persistProposals(){
  try{ await window.storage.set('crm:proposals', JSON.stringify(DB.proposals), true); }catch(e){}
}
async function persistInadimplencias(){

/* =========================================================
   INADIMPLÊNCIA
   Lista de clientes inadimplentes trazidos das seguradoras (arquivo, API futura, ou manual).
   O consultor de inadimplência (Administrador/Super Administrador) vincula cada registro a
   uma divisão; só depois disso o corretor daquela divisão enxerga o item, em modo
   só-leitura, com botão para baixar o boleto/link.
   ========================================================= */
let INADIMP_FILTERS = { seguradora:'', dataIni:'', dataFim:'', cliente:'' };
function canManageInadimplencia(){
  return isAdminRole() && hasPerm('inadimplencia_gerenciar');
}
function inadimplenciaScope(){
  if(canManageInadimplencia()) return DB.inadimplencias;
  if(!CURRENT_USER || !CURRENT_USER.groupId) return [];
  return DB.inadimplencias.filter(x=>x.groupId===CURRENT_USER.groupId);
}
function isInadBoletoVencido(x){
  return !!(x.groupId && x.vencimentoBoleto && x.vencimentoBoleto < todayISO());
}
function renderInadimplenciaFilterBar(){
  const f = INADIMP_FILTERS;
  const seguradorasPresentes = Array.from(new Set(DB.inadimplencias.map(x=>x.seguradora).filter(Boolean))).sort();
  return `
    <div class="panel">
      <div class="panel-title">Filtros</div>
      <div class="field-grid" style="margin-top:10px;">
        <div class="field full"><label>Nome do Cliente</label><input id="inad_f_cliente" value="${f.cliente||''}" placeholder="Buscar por segurado..." oninput="INADIMP_FILTERS.cliente=this.value; renderInadimplencia();"/></div>
        <div class="field"><label>Seguradora</label>
          <select onchange="INADIMP_FILTERS.seguradora=this.value; renderInadimplencia();">
            <option value="">Todas</option>
            ${seguradorasPresentes.map(s=>`<option value="${s}" ${f.seguradora===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Vencimento — De</label><input type="date" value="${f.dataIni||''}" onchange="INADIMP_FILTERS.dataIni=this.value; renderInadimplencia();"/></div>
        <div class="field"><label>Vencimento — Até</label><input type="date" value="${f.dataFim||''}" onchange="INADIMP_FILTERS.dataFim=this.value; renderInadimplencia();"/></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px;">
        <button class="filter-clear" onclick="INADIMP_FILTERS={seguradora:'',dataIni:'',dataFim:'',cliente:''}; renderInadimplencia();">Limpar filtros</button>
      </div>
    </div>
  `;
}
function renderInadimplencia(){
  const root = document.getElementById('inadimplenciaRoot');
  if(!root) return;
  const canManage = canManageInadimplencia();
  const f = INADIMP_FILTERS;
  const list = inadimplenciaScope().filter(x=>{
    if(f.seguradora && x.seguradora!==f.seguradora) return false;
    if(f.dataIni && x.vencimentoOriginal < f.dataIni) return false;
    if(f.dataFim && x.vencimentoOriginal > f.dataFim) return false;
    if(f.cliente && !(x.segurado||'').toLowerCase().includes(f.cliente.toLowerCase())) return false;
    return true;
  }).sort((a,b)=> (a.vencimentoOriginal||'').localeCompare(b.vencimentoOriginal||''));

  const totalClientes = new Set(list.map(x=>(x.segurado||'').toLowerCase().trim()+'|'+(x.cpfCnpj||'').trim())).size;
  const totalParcelas = list.length;
  const totalValor = list.reduce((s,x)=>s+(x.valorParcela||0),0);
  const vencidos = list.filter(isInadBoletoVencido).length;
  const naoVinculadas = list.filter(x=>!x.groupId).length;

  const kpiHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;">
      <div class="kpi-card"><div class="kpi-label">Clientes inadimplentes</div><div class="kpi-value">${totalClientes}</div></div>

async function saveInadimplencia(id, isNew){
  if(!canManageInadimplencia()){ toast('Você não tem permissão para gerenciar inadimplência.'); return; }
  const get = elId=>{ const el=document.getElementById(elId); return el ? el.value.trim() : ''; };
  const segurado = get('inad_segurado');
  if(!segurado){ toast('Informe o nome do segurado'); return; }
  let x = DB.inadimplencias.find(i=>i.id===id);
  const isCreating = !x;
  const groupId = get('inad_group') || null;
  const payload = {
    segurado, cpfCnpj: get('inad_cpf'), seguradora: get('inad_seguradora'),
    apolice: get('inad_apolice'), endosso: get('inad_endosso'),
    vencimentoOriginal: get('inad_vencorig'), valorParcela: parseFloat(get('inad_valor'))||0,
    groupId, produto: get('inad_produto'), vencimentoBoleto: get('inad_vencboleto'),
    boletoLink: get('inad_boletolink'), boletoFile: window._inadDraftAttachment || null,
  };
  if(isCreating){
    x = {
      id, inclusionSource:'manual', history:[],
      createdAt: todayISO(), createdBy: CURRENT_USER.id, createdByName: CURRENT_USER.name,
      ...payload,
    };
    DB.inadimplencias.unshift(x);
    x.history.push({date:todayISO(), text:`Cadastrada manualmente por ${CURRENT_USER.name}.`});
  }else{
    const wasLinked = !!x.groupId;
    Object.assign(x, payload);
    x.updatedAt = todayISO();
    if(!wasLinked && x.groupId){
      const g = groupById(x.groupId);
      x.history.push({date:todayISO(), text:`Vinculada à divisão ${g?g.name:''} por ${CURRENT_USER.name}.`});
    }else{
      x.history.push({date:todayISO(), text:`Dados atualizados por ${CURRENT_USER.name}.`});
    }
  }
  await persistInadimplencias();
  closeModal();
  renderInadimplencia();
  toast(isCreating ? 'Inadimplência cadastrada' : 'Alterações salvas');
  logAction('Inadimplência '+(isCreating?'cadastrada':'editada'), `${segurado} — ${payload.seguradora}`);
}

const INAD_SHEET_HEADERS = ['Segurado','CPF/CNPJ','Seguradora','Apólice','Endosso','Vencimento Original','Valor da Parcela'];
function downloadInadimplenciaTemplate(){
  const example = { 'Segurado':'João da Silva', 'CPF/CNPJ':'000.000.000-00', 'Seguradora':INSURERS[0], 'Apólice':'AP-12345', 'Endosso':'', 'Vencimento Original': todayISO(-30), 'Valor da Parcela': 250.00 };
  const ws = XLSX.utils.json_to_sheet([example], {header:INAD_SHEET_HEADERS});
  ws['!cols'] = INAD_SHEET_HEADERS.map(()=>({wch:22}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Inadimplência');
  XLSX.writeFile(wb, 'modelo-importacao-inadimplencia-cockpit.xlsx');
  toast('Modelo de planilha baixado');
}
function handleImportInadimplenciaFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:false});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      let importedCount = 0, skippedNoName = 0, skippedDuplicate = 0;
      rows.forEach(row=>{
        const segurado = (row['Segurado']||row['Nome do Cliente']||row['Cliente']||'').toString().trim();
        if(!segurado){ skippedNoName++; return; }
        const apolice = (row['Apólice']||row['Apolice']||'').toString().trim();
        const endosso = (row['Endosso']||'').toString().trim();
        const vencimentoOriginal = (row['Vencimento Original']||row['Venc. Original']||'').toString().trim();
        const dup = DB.inadimplencias.some(x=>
          (x.segurado||'').toLowerCase()===segurado.toLowerCase() &&
          (x.apolice||'')===apolice && (x.endosso||'')===endosso && (x.vencimentoOriginal||'')===vencimentoOriginal
        );
        if(dup){ skippedDuplicate++; return; }
        DB.inadimplencias.unshift({
          id: uid('inad'), segurado, cpfCnpj:(row['CPF/CNPJ']||row['CPF']||'').toString(),
          seguradora:(row['Seguradora']||INSURERS[0]).toString(), apolice, endosso, vencimentoOriginal,
          valorParcela: parseFloat(row['Valor da Parcela']||row['Valor Parcela'])||0,
          groupId:null, produto:'', vencimentoBoleto:'', boletoFile:null, boletoLink:'',
          inclusionSource:'arquivo',
          createdAt: todayISO(), createdBy: CURRENT_USER.id, createdByName: CURRENT_USER.name,
          history:[{date:todayISO(), text:`Importada via planilha por ${CURRENT_USER.name}.`}],
        });
        importedCount++;
      });
      await persistInadimplencias();
      closeModal();
      renderInadimplencia();
      const parts = [`${importedCount} importada(s)`];
      if(skippedDuplicate>0) parts.push(`${skippedDuplicate} já existiam (não duplicadas)`);
      if(skippedNoName>0) parts.push(`${skippedNoName} sem nome do segurado`);
      toast(parts.join(' · '));
      logAction('Inadimplência importada', parts.join(' · '));
    }catch(err){
      console.error(err);
      toast('Não foi possível ler essa planilha. Confira o formato do arquivo.');
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

let PROP_ADV_FILTERS = { corretora:'', prodGroup:'', seguradora:'', cliente:'', tipo:'', status:'', produto:'', responsavel:'', dataIni:'', dataFim:'', apoliceStatus:'', acceptedStatus:'' };
function setPropAdvFilter(field, value){ PROP_ADV_FILTERS[field] = value; renderCurrentView(); }
function clearPropAdvFilters(){ Object.keys(PROP_ADV_FILTERS).forEach(k=>PROP_ADV_FILTERS[k]=''); renderCurrentView(); }
function applyPropAdvFilters(list){
  const f = PROP_ADV_FILTERS;
  return list.filter(p=>{
    if(f.corretora && p.groupId!==f.corretora) return false;
    if(f.prodGroup && (p.productionGroup||'')!==f.prodGroup) return false;
    if(f.seguradora && p.insurer!==f.seguradora) return false;
    if(f.cliente && !p.clientName.toLowerCase().includes(f.cliente.toLowerCase())) return false;
    if(f.tipo && p.type!==f.tipo) return false;
    if(f.status && p.status!==f.status) return false;
    if(f.produto && p.product!==f.produto) return false;
    if(f.responsavel && p.createdBy!==f.responsavel) return false;
    if(f.dataIni && p.createdAt < f.dataIni) return false;
    if(f.dataFim && p.createdAt > f.dataFim) return false;
    if(f.apoliceStatus && p.status==='emitida' && (p.apoliceStatus||'vigente')!==f.apoliceStatus) return false;
    if(f.acceptedStatus && p.status!==f.acceptedStatus) return false;
    return true;
  });
}

function handleImportPropostaFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const isAdmin = isAdminRole();
  const groupSel = document.getElementById('impp_group');
  const targetGroupId = isAdmin ? (groupSel ? groupSel.value : ADMIN_GROUP_FILTER) : CURRENT_USER.groupId;
  if(!targetGroupId){ toast('Selecione a divisão antes de importar'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:false});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      const importedIds = [];
      let skippedNoName = 0, skippedNoQuiver = 0;
      rows.forEach(row=>{
        const clientName = (row['Nome do Cliente']||row['Cliente']||'').toString().trim();
        if(!clientName){ skippedNoName++; return; }
        const quiverProposalNumber = (row['Número da Proposta (Quiver)']||row['Número da Proposta']||row['Quiver']||'').toString().trim();
        if(!quiverProposalNumber){ skippedNoQuiver++; return; } // o número Quiver é obrigatório — é a chave-mestra da proposta/apólice
        const responsavelName = (row['Responsável (corretor)']||row['Responsável']||'').toString().trim();
        const matchedUser = DB.users.find(u=>u.groupId===targetGroupId && u.name.toLowerCase()===responsavelName.toLowerCase());
        const createdBy = matchedUser ? matchedUser.id : CURRENT_USER.id;
        const createdByName = matchedUser ? matchedUser.name : CURRENT_USER.name;
        const commissionPct = parseFloat(row['Comissão (%)'])||0;
        const p = {
          id: uid('prop'),
          number: nextProposalNumber(),
          groupId: targetGroupId,
          relatedClientId: null,
          clientName,
          insurer: (row['Seguradora']||INSURERS[0]).toString(),
          product: (row['Produto']||PRODUCTS[0]).toString(),
          type: (row['Tipo']||'Seguro Novo').toString(),
          commissionPct,
          premiumLiquido: parseFloat(row['Prêmio Líquido'])||0,
          productionGroup: resolveProductionGroup(targetGroupId, (row['Grupo de Produção']||'').toString()),
          itemApolice: (row['Item da Apólice']||'').toString(),
          quiverProposalNumber,
          vigenciaFim: (row['Vigência - Data Fim']||'').toString(),
          policyNumberInsurer: (row['Número da Apólice na Seguradora']||row['Número da Apólice']||'').toString(),
          emSinistro:false, teveAssistencia:false, endossos:[], sinistros:[], apoliceStatus:null,
          status: 'pendente',
          quiverCode:'', rejectReason:'', returnReason:'',
          policyNumber:(row['Número da Apólice']||'').toString(), issueDate:'', pendencyReason:'',
          attachments: [],
          createdBy, createdByName,
          createdAt: todayISO(), updatedAt: '',
          history: [{date:todayISO(), text: row['Observações'] ? row['Observações'].toString() : `Proposta importada via planilha por ${CURRENT_USER.name}.`}],
        };
        DB.proposals.unshift(p);
        importedIds.push(p.id);
      });
      persistProposals();
      closeModal();
      const skipMsgParts = [];
      if(skippedNoQuiver>0) skipMsgParts.push(`${skippedNoQuiver} sem número Quiver (obrigatório)`);
      if(skippedNoName>0) skipMsgParts.push(`${skippedNoName} sem nome do cliente`);
      const skipMsg = skipMsgParts.length ? ` — ${skipMsgParts.join(', ')} foram ignorada(s)` : '';
      toast(`${importedIds.length} proposta(s) importada(s) com sucesso${skipMsg}`);
      if(importedIds.length) openImportReviewWizard(importedIds);
      else renderCurrentView();
    }catch(err){
      console.error(err);
      toast('Não foi possível ler a planilha. Verifique o formato.');
    }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

/* Assistente pós-importação: pede anexo e comissão faltante, proposta por proposta */
function openImportReviewWizard(ids){
  window._importReviewQueue = ids;
  window._importReviewIndex = 0;
  renderImportReviewStep();
}
function renderImportReviewStep(){
  const ids = window._importReviewQueue || [];
  const idx = window._importReviewIndex || 0;
  if(idx >= ids.length){
    closeModal();
    toast('Revisão da importação concluída');
    renderCurrentView();
    return;
  }
  const p = DB.proposals.find(x=>x.id===ids[idx]);
  const needsCommission = !p.commissionPct;
  window._importReviewAttachments = [];
  const html = `
    <div class="modal modal-small">
      <div class="modal-head">
        <div class="mh-info"><div class="mh-name">Completar importação (${idx+1}/${ids.length})</div><div class="mh-sub">Proposta nº ${p.number} · ${p.clientName}</div></div>
        <button class="modal-close" onclick="skipImportReview()">${ICONS.close}</button>
      </div>
      <div class="modal-body" style="padding:20px 22px;">
        ${needsCommission ? `
          <div class="field full" style="margin-bottom:12px;"><label>Comissão (%) — não veio na planilha</label><input id="imr_commission" type="number" step="0.1" placeholder="Ex: 20"/></div>
        ` : ''}
        <div class="field full">
          <label>Anexos desta proposta</label>
          <input type="file" id="imr_files" multiple onchange="handleImportReviewFiles(event)"/>
          <div id="imr_files_list" class="attachment-list"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="skipImportReview()">Pular esta</button>
        <button class="btn btn-primary" onclick="saveImportReviewStep('${p.id}', ${needsCommission})">${ICONS.check} ${idx===ids.length-1?'Concluir':'Salvar e Próxima'}</button>
      </div>
    </div>
  `;
  document.getElementById('modalOverlay').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
function handleImportReviewFiles(event){
  const files = Array.from(event.target.files);
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      window._importReviewAttachments.push({name:file.name, dataUrl:e.target.result});
      renderImportReviewAttachmentsList();
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}
function renderImportReviewAttachmentsList(){
  const el = document.getElementById('imr_files_list');
  if(!el) return;
  el.innerHTML = (window._importReviewAttachments||[]).map((a,i)=>`
    <div class="attachment-chip">${ICONS.file}<span>${a.name}</span><button onclick="removeImportReviewAttachment(${i})">${ICONS.close}</button></div>
  `).join('');
}
function removeImportReviewAttachment(i){
  window._importReviewAttachments.splice(i,1);
  renderImportReviewAttachmentsList();
}
async function saveImportReviewStep(proposalId, needsCommission){
  const p = DB.proposals.find(x=>x.id===proposalId);
  if(needsCommission){
    const raw = document.getElementById('imr_commission').value;
    if(raw!==''){ p.commissionPct = parseFloat(raw)||0; }
  }
  if(window._importReviewAttachments && window._importReviewAttachments.length){
    p.attachments = (p.attachments||[]).concat(window._importReviewAttachments);
    p.history.unshift({date:todayISO(), text:`${window._importReviewAttachments.length} anexo(s) adicionado(s) na revisão de importação por ${CURRENT_USER.name}.`});
  }
  p.updatedAt = todayISO();
  await persistProposals();
  window._importReviewIndex = (window._importReviewIndex||0) + 1;
  renderImportReviewStep();
}
function skipImportReview(){
  window._importReviewIndex = (window._importReviewIndex||0) + 1;
  renderImportReviewStep();
}

function matchManualApoliceClient(typedName){
  const hint = document.getElementById('ma_client_match_hint');
  const idField = document.getElementById('ma_client_id');
  if(!hint || !idField) return;
  const name = (typedName||'').trim().toLowerCase();
  if(!name){ idField.value=''; hint.innerHTML=''; return; }
  const match = clientsInScope().find(cl=>cl.name.trim().toLowerCase()===name);
  if(match){
    idField.value = match.id;
    hint.style.color = 'var(--success)';
    hint.innerHTML = `✓ Cliente cadastrado encontrado — telefone, e-mail e endereço já cadastrados serão vinculados a esta apólice.`;
  }else{
    idField.value = '';
    hint.style.color = 'var(--text-faint)';
    hint.innerHTML = `Cliente não encontrado na aba Clientes. A apólice será registrada só com o nome — cadastre o cliente para vincular os dados automaticamente.`;
  }
}
function handleManualApoliceFiles(event){
  const files = Array.from(event.target.files);
  let remaining = files.length;
  if(!remaining) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      window._manualApoliceAttachments.push({ name:file.name, dataUrl:e.target.result });
      renderManualApoliceAttachmentsList();
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}
function renderManualApoliceAttachmentsList(){
  const el = document.getElementById('ma_files_list');
  if(!el) return;
  el.innerHTML = (window._manualApoliceAttachments||[]).map((a,i)=>`
    <div class="attachment-chip">${ICONS.file}<span>${a.name}</span><button onclick="removeManualApoliceAttachment(${i})">${ICONS.close}</button></div>
  `).join('');
}
function removeManualApoliceAttachment(i){
  window._manualApoliceAttachments.splice(i,1);
  renderManualApoliceAttachmentsList();
}
async function saveManualApolice(){
  if(!canEditPolicies()){ toast('Somente Super Administrador e Administrador podem cadastrar apólice manualmente.'); return; }
  const get = id=>{ const el=document.getElementById(id); return el ? el.value.trim() : ''; };
  const clientName = get('ma_client');
  if(!clientName){ toast('Informe o nome do cliente'); return; }
  const isAdmin = isAdminRole();
  let targetGroupId = CURRENT_USER.groupId;
  if(isAdmin){
    targetGroupId = get('ma_group');
    if(!targetGroupId){ toast('Informe a divisão dessa apólice'); return; }
  }
  const commissionRaw = get('ma_commission');
  if(commissionRaw===''){ toast('Informe a comissão (%)'); return; }
  const quiverProposalNumber = get('ma_quivernum');
  if(!quiverProposalNumber){ toast('Informe o número da proposta no Quiver — é obrigatório para cadastrar a apólice.'); return; }
  const policyNumber = get('ma_policy');
  if(!policyNumber){ toast('Informe o número da apólice'); return; }
  const issueDate = get('ma_issuedate');
  if(!issueDate){ toast('Informe a data de emissão'); return; }
  const linkedIdField = document.getElementById('ma_client_id');
  const relatedClientId = (linkedIdField && linkedIdField.value) ? linkedIdField.value : null;
  const p = {
    id: uid('prop'),
    number: nextProposalNumber(),
    groupId: targetGroupId,
    relatedClientId,
    clientName,
    insurer: get('ma_insurer') || INSURERS[0],
    product: get('ma_product') || PRODUCTS[0],
    type: get('ma_type') || 'Seguro Novo',
    commissionPct: parseFloat(commissionRaw)||0,
    premiumLiquido: parseFloat(get('ma_premiumliq'))||0,
    productionGroup: resolveProductionGroup(targetGroupId, get('ma_prodgroup')),
    itemApolice: get('ma_item'), quiverProposalNumber,
    vigenciaFim: get('ma_vigenciafim'),
    policyNumberInsurer: get('ma_policyinsurer'),
    emSinistro:false, teveAssistencia:false, endossos:[], sinistros:[],
    apoliceStatus: get('ma_status') || 'vigente',
    status: 'emitida',
    quiverCode:'', rejectReason:'', returnReason:'', policyNumber, issueDate, pendencyReason:'',
    attachments: window._manualApoliceAttachments || [],
    createdBy: CURRENT_USER.id, createdByName: CURRENT_USER.name,
    createdAt: todayISO(), updatedAt: todayISO(),
    history: [{date:todayISO(), text:`Apólice cadastrada manualmente por ${CURRENT_USER.name} (nº ${policyNumber}).`}],
  };
  DB.proposals.unshift(p);
  await persistProposals();
  closeModal();
  renderCurrentView();
  toast(`Apólice ${policyNumber} cadastrada com sucesso`);
  logAction('Apólice cadastrada manualmente', `Nº ${p.number} - ${p.clientName} - Apólice ${policyNumber}`);
}

/* =========================================================
   APÓLICE — importar/exportar planilha
   O Número da Proposta (Quiver) é obrigatório: é a chave-mestra
   que identifica a apólice. Nenhuma linha sem esse número é
   importada, e nenhuma proposta é emitida sem ele preenchido.
   ========================================================= */
const APOLICE_SHEET_HEADERS = [
  'Número da Proposta (Quiver)','Nome do Cliente','Seguradora','Produto','Item da Apólice','Número da Apólice',
  'Número da Apólice na Seguradora','Comissão (%)','Prêmio Líquido','Grupo de Produção','Responsável (corretor)',
  'Data de Emissão','Vigência - Data Fim','Observações'
];
function apoliceToRow(p){
  return {
    'Número da Proposta (Quiver)': p.quiverProposalNumber||'', 'Nome do Cliente': p.clientName, 'Seguradora': p.insurer, 'Produto': p.product,
    'Item da Apólice': p.itemApolice||'', 'Número da Apólice': p.policyNumber||'', 'Número da Apólice na Seguradora': p.policyNumberInsurer||'',
    'Comissão (%)': p.commissionPct, 'Prêmio Líquido': p.premiumLiquido||'', 'Grupo de Produção': p.productionGroup||'',
    'Responsável (corretor)': p.createdByName, 'Data de Emissão': p.issueDate||'', 'Vigência - Data Fim': p.vigenciaFim||'',
    'Observações': (p.history&&p.history.length) ? p.history[p.history.length-1].text : ''
  };
}
function downloadApoliceTemplate(){
  const example = {
    'Número da Proposta (Quiver)':'QV-000123', 'Nome do Cliente':'João da Silva', 'Seguradora':'Porto Seguro', 'Produto':'Auto',
    'Item da Apólice':'Veículo Fiat Argo 2022', 'Número da Apólice':'AP-58312', 'Número da Apólice na Seguradora':'',
    'Comissão (%)':20, 'Prêmio Líquido':1800, 'Grupo de Produção':'Matriz', 'Responsável (corretor)':'Marina Costa',
    'Data de Emissão': todayISO(), 'Vigência - Data Fim': todayISO(365), 'Observações':'Apólice importada via planilha.'
  };
  const ws = XLSX.utils.json_to_sheet([example], {header:APOLICE_SHEET_HEADERS});
  ws['!cols'] = APOLICE_SHEET_HEADERS.map(()=>({wch:22}));

function handleImportApolicesFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const isAdmin = isAdminRole();
  const groupSel = document.getElementById('impa_group');
  const targetGroupId = isAdmin ? (groupSel ? groupSel.value : ADMIN_GROUP_FILTER) : CURRENT_USER.groupId;
  if(!targetGroupId){ toast('Selecione a divisão antes de importar'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:false});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      let importedCount = 0, skippedNoName = 0, skippedNoQuiver = 0;
      rows.forEach(row=>{
        const clientName = (row['Nome do Cliente']||row['Cliente']||'').toString().trim();
        if(!clientName){ skippedNoName++; return; }
        const quiverProposalNumber = (row['Número da Proposta (Quiver)']||row['Número da Proposta']||row['Quiver']||'').toString().trim();
        if(!quiverProposalNumber){ skippedNoQuiver++; return; } // obrigatório — chave-mestra da apólice
        const responsavelName = (row['Responsável (corretor)']||row['Responsável']||'').toString().trim();
        const matchedUser = DB.users.find(u=>u.groupId===targetGroupId && u.name.toLowerCase()===responsavelName.toLowerCase());
        const createdBy = matchedUser ? matchedUser.id : CURRENT_USER.id;
        const createdByName = matchedUser ? matchedUser.name : CURRENT_USER.name;
        const p = {
          id: uid('prop'),
          number: nextProposalNumber(),
          groupId: targetGroupId,
          relatedClientId: null,
          clientName,
          insurer: (row['Seguradora']||INSURERS[0]).toString(),
          product: (row['Produto']||PRODUCTS[0]).toString(),
          type: 'Seguro Novo',
          commissionPct: parseFloat(row['Comissão (%)'])||0,
          premiumLiquido: parseFloat(row['Prêmio Líquido'])||0,
          productionGroup: resolveProductionGroup(targetGroupId, (row['Grupo de Produção']||'').toString()),
          itemApolice: (row['Item da Apólice']||'').toString(),
          quiverProposalNumber,
          vigenciaFim: (row['Vigência - Data Fim']||'').toString(),
          policyNumberInsurer: (row['Número da Apólice na Seguradora']||'').toString(),
          emSinistro:false, teveAssistencia:false, endossos:[], sinistros:[],
          apoliceStatus:'vigente',
          status: 'emitida',
          quiverCode:'', rejectReason:'', returnReason:'',
          policyNumber:(row['Número da Apólice']||'').toString(),
          issueDate: (row['Data de Emissão']||'').toString() || todayISO(),
          pendencyReason:'',
          attachments: [],
          createdBy, createdByName,
          createdAt: todayISO(), updatedAt: todayISO(),
          history: [{date:todayISO(), text: row['Observações'] ? row['Observações'].toString() : `Apólice importada via planilha por ${CURRENT_USER.name}.`}],
        };
        DB.proposals.unshift(p);
        importedCount++;
      });
      persistProposals();
      closeModal();
      const skipMsgParts = [];
      if(skippedNoQuiver>0) skipMsgParts.push(`${skippedNoQuiver} sem número Quiver (obrigatório)`);
      if(skippedNoName>0) skipMsgParts.push(`${skippedNoName} sem nome do cliente`);
      const skipMsg = skipMsgParts.length ? ` — ${skipMsgParts.join(', ')} foram ignorada(s)` : '';
      toast(`${importedCount} apólice(s) importada(s) com sucesso${skipMsg}`);
      renderCurrentView();
    }catch(err){
      console.error(err);
      toast('Não foi possível ler a planilha. Verifique o formato.');
    }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function sinistroStatusLabel(status){

async function createSinistro(id){
  if(!canEditPolicies()){ toast('Você não tem permissão para registrar sinistro/assistência.'); return; }
  const tipo = document.getElementById('sin_tipo').value;
  const dataOcorrencia = document.getElementById('sin_data').value || todayISO();
  const numero = document.getElementById('sin_numero').value.trim();
  const contato = document.getElementById('sin_contato').value.trim();
  const descricao = document.getElementById('sin_desc').value.trim();
  if(!descricao){ toast('Descreva o ocorrido para abrir o sinistro/assistência'); return; }
  const temTerceiro = document.getElementById('sin_tem_terceiro').value === 'sim';
  const terceiroNome = temTerceiro ? document.getElementById('sin_terceiro_nome').value.trim() : '';
  const terceiroContato = temTerceiro ? document.getElementById('sin_terceiro_contato').value.trim() : '';
  const terceiroDoc = temTerceiro ? document.getElementById('sin_terceiro_doc').value.trim() : '';
  const p = DB.proposals.find(x=>x.id===id);
  const files = Array.from(document.getElementById('sin_files').files);
  const terceiroFiles = temTerceiro ? Array.from(document.getElementById('sin_terceiro_files').files) : [];
  const terceiroAnexos = [];
  const finish = async ()=>{
    p.sinistros = p.sinistros || [];
    p.sinistros.push({
      id:uid('sin'), tipo, status:'aberto', dataOcorrencia, numero, contato, descricao,
      temTerceiro, terceiroNome, terceiroContato, terceiroDoc, terceiroAnexos,
      createdBy:CURRENT_USER.name, createdAt:todayISO()
    });
    if(tipo==='Sinistro') p.emSinistro = true;
    if(tipo==='Assistência') p.teveAssistencia = true;
    p.updatedAt = todayISO();
    p.history.unshift({date:todayISO(), text:`${tipo} aberto(a) por ${CURRENT_USER.name}${numero?' — protocolo '+numero:''}${temTerceiro?' · com terceiro envolvido':''}: ${descricao}`});
    await persistProposals();
    logAction(`${tipo} registrado(a)`, `Apólice ${p.policyNumber} (${p.clientName})`);
    renderApoliceDetailModal(id);
    if(CURRENT_VIEW==='apolices') renderApolicesEmitidas();
    toast(`${tipo} aberto(a) com sucesso`);
    const novoSinistro = p.sinistros[p.sinistros.length-1];
    openSinistroNotifyModal(id, novoSinistro.id);
  };
  const allFiles = [...files.map(f=>({file:f, dest:'geral'})), ...terceiroFiles.map(f=>({file:f, dest:'terceiro'}))];
  if(allFiles.length){
    let count = allFiles.length;
    allFiles.forEach(({file,dest})=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        if(dest==='geral') p.attachments.push({name:file.name, dataUrl:e.target.result});
        else terceiroAnexos.push({name:file.name, dataUrl:e.target.result});
        count--;
        if(count===0) finish();
      };
      reader.readAsDataURL(file);
    });
  }else{
    await finish();
  }
}
async function updateSinistroStatus(policyId, sinistroId, status){
  if(!canEditPolicies()){ toast('Você não tem permissão para alterar o sinistro/assistência.'); return; }
  const p = DB.proposals.find(x=>x.id===policyId);
  const s = (p.sinistros||[]).find(x=>x.id===sinistroId);
  if(!s) return;
  s.status = status;
  s.updatedAt = todayISO();
  if(s.tipo==='Sinistro'){
    p.emSinistro = p.sinistros.some(x=>x.tipo==='Sinistro' && x.status!=='concluido' && x.status!=='indeferido');
  }
  p.updatedAt = todayISO();
  p.history.unshift({date:todayISO(), text:`${CURRENT_USER.name} alterou o status de um(a) ${s.tipo.toLowerCase()} para "${sinistroStatusLabel(status)}".`});
  await persistProposals();
  logAction('Sinistro/Assistência atualizado(a)', `${s.tipo} — Apólice ${p.policyNumber} (${p.clientName})`);
  renderApoliceDetailModal(policyId);
  if(CURRENT_VIEW==='apolices') renderApolicesEmitidas();
  openSinistroNotifyModal(policyId, sinistroId);
}
function openSinistroNotifyModal(policyId, sinistroId){

    { id:'segurado', label:'Segurado', sub: cliente ? (cliente.whatsapp||cliente.phone||cliente.email||'sem contato cadastrado') : (p.clientName+' — sem contato cadastrado') },
    ...(s.temTerceiro ? [{ id:'terceiro', label:'Terceiro envolvido', sub: s.terceiroContato || 'sem contato cadastrado' }] : []),
    { id:'corretor', label:'Corretor responsável', sub: corretor ? (corretor.email||'sem contato cadastrado') : (p.createdByName||'sem contato cadastrado') },
  ];
  const html = `

      <div class="modal-head">

        <button class="modal-close" onclick="closeModal()">${ICONS.close}</button>
      </div>
      <div class="modal-body" style="padding:20px 22px;">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">Quem você quer avisar sobre esta atualização?</div>
        ${options.map(o=>`
          <div class="import-option" style="display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:12px 14px;">
            <div class="io-text"><div class="io-title">${o.label}</div><div style="font-size:11px;color:var(--text-faint);">${o.sub}</div></div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-wpp btn-sm" onclick="sendSinistroNotify('${policyId}','${sinistroId}','${o.id}','whatsapp')">${ICONS.wpp} WhatsApp</button>
              <button class="btn btn-sm" onclick="sendSinistroNotify('${policyId}','${sinistroId}','${o.id}','email')">✉️ E-mail</button>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal()">Agora não</button>
      </div>
    </div>
  `;
  document.getElementById('modalOverlay').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
function sinistroNotifyTarget(policyId, sinistroId, who){
  const p = DB.proposals.find(x=>x.id===policyId);
  const s = (p.sinistros||[]).find(x=>x.id===sinistroId);
  if(who==='segurado'){
    const cliente = p.relatedClientId ? DB.clients.find(x=>x.id===p.relatedClientId) : null;
    return { name:p.clientName, phone: cliente?(cliente.whatsapp||cliente.phone):'', email: cliente?cliente.email:'' };
  }
  if(who==='terceiro'){
    const contato = s.terceiroContato||'';
    const isEmail = contato.includes('@');
    return { name:s.terceiroNome||'Terceiro', phone: isEmail?'':contato, email: isEmail?contato:'' };
  }
  const corretor = DB.users.find(x=>x.id===p.createdBy);
  return { name: corretor?corretor.name:(p.createdByName||'Corretor'), phone:'', email: corretor?corretor.email:'' };
}
async function sendSinistroNotify(policyId, sinistroId, who, channel){
  const p = DB.proposals.find(x=>x.id===policyId);
  const s = (p.sinistros||[]).find(x=>x.id===sinistroId);
  const target = sinistroNotifyTarget(policyId, sinistroId, who);
  const msg = `Olá ${target.name.split(' ')[0]}, sobre o(a) ${s.tipo.toLowerCase()} da apólice ${p.policyNumber||''} (${p.clientName}): status atual é "${sinistroStatusLabel(s.status)}".`;
  if(channel==='whatsapp'){
    if(!target.phone){ toast('Sem telefone cadastrado para esse contato.'); return; }
    window.open(`https://wa.me/${(target.phone||'55').replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
  } else {
    if(!target.email){ toast('Sem e-mail cadastrado para esse contato.'); return; }
    await sendAppEmail(target.email, target.name, `Atualização de ${s.tipo}`, msg);
  }
  closeModal();
}

async function saveApoliceDados(id){

async function createEndosso(id){
  if(!canEditPolicies()){ toast('Você não tem permissão para registrar endosso.'); return; }
  const type = document.getElementById('end_type').value;
  const detalhes = document.getElementById('end_detalhes').value.trim();
  const valor = parseFloat(document.getElementById('end_valor').value)||0;
  if(!detalhes){ toast('Descreva os detalhes do endosso'); return; }
  const p = DB.proposals.find(x=>x.id===id);
  const files = Array.from(document.getElementById('end_files').files);
  const finish = async ()=>{
    p.endossos = p.endossos || [];
    p.endossos.push({id:uid('end'), date:todayISO(), type, detalhes, valor, createdBy:CURRENT_USER.name});
    p.status = 'pendente';
    p.updatedAt = todayISO();
    p.history.unshift({date:todayISO(), text:`Endosso registrado por ${CURRENT_USER.name}: ${type} — ${detalhes}`});
    await persistProposals();
    logAction('Endosso registrado', `${type} — Apólice ${p.policyNumber} (${p.clientName})`);
    closeModal();
    renderCurrentView();
    toast('Endosso registrado. A apólice voltou para acompanhamento em Proposta.');
  };
  if(files.length){
    let count = files.length;
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        p.attachments.push({name:file.name, dataUrl:e.target.result});
        count--;
        if(count===0) finish();
      };
      reader.readAsDataURL(file);
    });
  }else{
    await finish();
  }
}
